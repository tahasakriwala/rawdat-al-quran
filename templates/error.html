{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block main %}
<section class="phero" style="min-height:70vh;display:grid;align-items:center">
  <div class="ar-bg" aria-hidden="true">{{ code|ardigits }}</div>
  <div class="wrap">
    <div class="kick">{{ code }}</div>
    <h1 class="h1" style="margin-top:18px">{{ title }}</h1>
    <p class="lead">{{ msg }}</p>
    <div style="display:flex;gap:10px;margin-top:26px;flex-wrap:wrap"><a class="btn" href="{{ url_for('site.home') }}">Home</a><button class="btn btn-line" data-cmdk>Search</button></div>
  </div>
</section>
{% endblock %}
